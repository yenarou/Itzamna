services:
  scientific-engine:
    build:
      context: ./scientific-engine
      dockerfile: Dockerfile
    container_name: itzamna-scientific-engine
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: 8000
    restart: unless-stopped
    networks:
      - itzamna-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itzamna-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ScientificEngine__BaseUrl: http://scientific-engine:8000
    depends_on:
      - scientific-engine
    restart: unless-stopped
    networks:
      - itzamna-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: http://localhost:5000
    container_name: itzamna-frontend
    ports:
      - "4321:4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      # Browser-accessible API URL from the host machine. For LAN access, use http://<HOST_IP>:5000.
      PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - itzamna-network

networks:
  itzamna-network:
    driver: bridge
